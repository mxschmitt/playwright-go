title: Playwright for Go
email: max@schmitt.mx
description: >- # this means to ignore newlines until "baseurl:"
  Playwright is a Go library to automate Chromium, Firefox and WebKit with a single API.
  Playwright is built to enable cross-browser web automation that is ever-green, capable, reliable and fast.
lang: en-US
baseurl: "/playwright-go"
url: "https://mxschmitt.github.io"
twitter_username: maxibanki
github_username: mxschmitt
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji
# Only the Markdown docs are part of the website, everything else is Go source.
exclude:
  - "*.go"
  - CLAUDE.md
  - Dockerfile.example
  - cmd/
  - docs/
  - examples/
  - go.mod
  - go.sum
  - internal/
  - patches/
  - playwright/
  - scripts/
  - tests/
defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"
